<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title data-i18n="schedule.pageTitle">schedule · zaKNADka</title>

    <link rel="stylesheet" href="../style.css?v=20260921-1" />
  </head>

  <body>
    <div class="page-shell">
      <header class="site-header">
        <a
          class="site-logo"
          href="/"
          aria-label="zaKNADka home"
          data-i18n-aria-label="header.homeLabel"
        >
          zaKNADka
        </a>

        <div class="header-controls">
          <div
            class="language-switcher"
            role="group"
            aria-label="Language"
            data-i18n-aria-label="header.languageLabel"
          >
            <button
              class="language-option is-active"
              type="button"
              data-language="en"
              aria-pressed="true"
            >
              EN
            </button>

            <span class="language-divider">/</span>

            <button
              class="language-option"
              type="button"
              data-language="ru"
              aria-pressed="false"
            >
              RU
            </button>
          </div>

          <button
            class="theme-toggle"
            id="themeToggle"
            type="button"
            aria-label="Toggle theme"
            aria-pressed="false"
            data-i18n-aria-label="header.themeLabel"
          >
            <span class="theme-icon moon">☾</span>
            <span class="theme-icon sun">☀</span>
            <span class="theme-thumb"></span>
          </button>
        </div>
      </header>

      <main class="inner-main">
        <section class="inner-page">
          <p class="hero-eyebrow" data-i18n="schedule.eyebrow">
            CDS · HSE Moscow
          </p>

          <div class="page-heading">
            <div>
              <h1 class="inner-title" data-i18n="schedule.title">Schedule</h1>
              <a
                class="inner-home-link"
                href="/"
                aria-label="zaKNADka home"
                data-i18n-aria-label="header.homeLabel"
              >
                <svg
                  class="inner-home-icon"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path
                    d="M3 10.5L12 3l9 7.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M5.5 9.5V21h13V9.5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M9.5 21v-6h5v6"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </a>

              <p class="inner-description" data-i18n="schedule.description">
                Class schedule for HSE Computing and Data Science.
              </p>
            </div>

            <div class="page-controls">
              <div class="current-clock">
                <div class="current-clock-date" id="currentDate">—</div>

                <div class="current-clock-time" id="currentTime">--:--:--</div>

                <div
                  class="current-clock-zone"
                  id="currentTimezone"
                  data-i18n="schedule.localTime"
                >
                  LOCAL TIME
                </div>
              </div>

              <button
                class="schedule-timezone"
                id="timezoneToggle"
                type="button"
                aria-label="Switch schedule timezone"
                data-i18n-aria-label="schedule.timezoneLabel"
              >
                ASTANA TIME · UTC+5
              </button>
            </div>
          </div>

          <div
            class="group-switcher"
            aria-label="Select group"
            data-i18n-aria-label="schedule.groupLabel"
          >
            <button type="button">261</button>
            <button type="button">262</button>
            <button type="button" class="active">263</button>
          </div>

          <section class="schedule-week" id="scheduleWeek"></section>
        </section>
      </main>

      <footer class="site-footer">
        <div class="footer-identity">
          <span>sergazinov</span>
          <span class="footer-dot">·</span>
          <span>2026</span>
        </div>
      </footer>
    </div>

    <script src="../script.js?v=20260921-1"></script>
  </body>
</html>
