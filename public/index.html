<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>sergazinov</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page-shell">

        <header class="site-header">
            <a class="site-logo" href="/" aria-label="Sergazinov home">
                sergazinov
            </a>

            <button
                class="theme-toggle"
                id="themeToggle"
                type="button"
                aria-label="Toggle theme"
                aria-pressed="false"
            >
                <span class="theme-icon moon">☾</span>
                <span class="theme-icon sun">☀</span>
                <span class="theme-thumb"></span>
            </button>
        </header>


        <main class="home-main">

            <section class="home-hero">

                <p class="hero-eyebrow">
                    CDS · HSE Moscow
                </p>

                <h1 class="hero-title">
                    <span>Computing</span>
                    <span class="title-connector">&amp;</span>
                    <span>Data Science</span>
                </h1>

                <p class="hero-description">
                    A personal learning hub documenting my journey through
                    Full-Stack Development and the Computing &amp; Data Science program at HSE Moscow.
                </p>

                <nav class="hero-navigation" aria-label="Main navigation">
                    <a href="/courses/">Courses</a>
                    <a href="/schedule/">Schedule</a>
                    <a href="/deadlines/">Deadlines</a>
                </nav>

            </section>

        </main>


        <footer class="site-footer">

            <div class="footer-identity">
                <span>Artyom Sergazinov</span>
                <span class="footer-dot">·</span>
                <span>2026</span>
            </div>

            <a class="admin-link" href="/admin/">
                Admin
            </a>

        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
