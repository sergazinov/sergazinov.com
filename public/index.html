<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>sergazinov</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-shell">
      <header class="site-header">
        <a
          class="site-logo"
          href="/"
          aria-label="Sergazinov home"
          data-i18n-aria-label="header.homeLabel"
        >
          sergazinov
        </a>

        <div class="header-controls">
          <div
            class="language-switcher"
            role="group"
            aria-label="Language"
            data-i18n-aria-label="header.languageLabel"
          >
            <button
              class="language-option is-active"
              type="button"
              data-language="en"
              aria-pressed="true"
            >
              EN
            </button>

            <span class="language-divider">/</span>

            <button
              class="language-option"
              type="button"
              data-language="ru"
              aria-pressed="false"
            >
              RU
            </button>
          </div>

          <button
            class="theme-toggle"
            id="themeToggle"
            type="button"
            aria-label="Toggle theme"
            aria-pressed="false"
            data-i18n-aria-label="header.themeLabel"
          >
            <span class="theme-icon moon">☾</span>
            <span class="theme-icon sun">☀</span>
            <span class="theme-thumb"></span>
          </button>
        </div>
      </header>

      <main class="home-main">
        <section class="home-hero">
          <p class="hero-eyebrow" data-i18n="home.eyebrow">CDS · HSE Moscow</p>

          <h1 class="hero-title">
            <span data-i18n="home.titleFirst"> Computing </span>

            <span class="title-connector">&amp;</span>

            <span data-i18n="home.titleSecond"> Data Science </span>
          </h1>

          <div class="typing-demo" aria-hidden="true">
            <pre class="typing-code"><code><span class="code-keyword">int</span> main() {
  std::cout &lt;&lt; "<span id="typingText"></span><span class="typing-cursor">│</span>";
}</code></pre>
          </div>

          <nav
            class="hero-navigation"
            aria-label="Main navigation"
            data-i18n-aria-label="home.navigationLabel"
          >
            <a href="/courses/" data-i18n="nav.courses"> Courses </a>

            <a href="/schedule/" data-i18n="nav.schedule"> Schedule </a>

            <a href="/deadlines/" data-i18n="nav.deadlines"> Deadlines </a>
          </nav>
        </section>
      </main>

      <footer class="site-footer">
        <div class="footer-identity">
          <span>Artyom Sergazinov</span>
          <span class="footer-dot">·</span>
          <span>2026</span>
        </div>

        <a class="admin-link" href="/admin/" data-i18n="nav.admin"> Admin </a>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
